name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tally
          POSTGRES_PASSWORD: tally_ci
          POSTGRES_DB: tally
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tally -d tally"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      # Throwaway credentials for the ephemeral CI database, not a secret.
      DATABASE_URL: postgresql://tally:tally_ci@localhost:5432/tally
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run pytest